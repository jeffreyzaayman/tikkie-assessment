# Generated from lib/openapi.ts by `npm run openapi`. Do not edit.

openapi: 3.0.3
info:
  title: Person Service API
  version: 1.0.0
  description: |
    Stores persons and lists them. Every new person also fires a `PersonCreated` event on
    the person-created SNS topic (see the README).

    **Authentication:** every method requires AWS Signature Version 4 (IAM). The caller
    needs `execute-api:Invoke` on the API. Unsigned requests get `403`. Use awscurl,
    Postman's "AWS Signature" auth or an AWS SDK; the "Try it out" button in Swagger UI
    can't sign requests.

    **Throttling:** 10 requests per second per stage, bursts up to 20. Above that the API returns `429`.

    **Personal data:** requests and responses contain names, phone numbers and addresses.
    Error messages never echo submitted values.
servers:
  - url: https://{apiId}.execute-api.eu-west-1.amazonaws.com/{stage}
    description: The `ApiUrl` output of the `PersonService-<stage>` stack
    variables:
      apiId:
        default: abc123defg
        description: The REST API id
      stage:
        default: dev
        enum:
          - dev
          - prod
security:
  - sigv4: []
tags:
  - name: Persons
    description: Create, get and list persons
paths:
  /person:
    post:
      tags:
        - Persons
      operationId: createPerson
      summary: Create a person
      description: |
        Validates and trims every field, normalises the phone number to E.164 and stores
        the person. Phone numbers are unique: a second person with the same number (in any
        format) is rejected with `409`. On success a `PersonCreated` event is published
        asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
            examples:
              dutchMobile:
                summary: Dutch number without country code
                value:
                  firstName: Ada
                  lastName: Lovelace
                  phoneNumber: 06 12345678
                  address: Dam 1, 1012 JS Amsterdam
      responses:
        "201":
          description: Person created
          headers:
            Location:
              description: Path of the new person
              schema:
                type: string
                example: /person/1249302d-9c20-4a1f-8cf5-afdd0173f2a9
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: |
            The body is not valid JSON or fails validation. API Gateway checks the shape
            against `PersonInput` first (`Invalid request body`); the Lambda then checks
            the rest, such as the phone number (`Validation failed`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                shape:
                  summary: Rejected by API Gateway
                  value:
                    message: Invalid request body
                    errors:
                      - '[object has missing required properties (["address"])]'
                validation:
                  summary: Rejected by the Lambda
                  value:
                    message: Validation failed
                    errors:
                      - phoneNumber must be a valid phone number
        "403": &a1
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A person with this phone number already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                duplicate:
                  value:
                    message: A person with this phone number already exists
        "429": &a2
          $ref: "#/components/responses/TooManyRequests"
        "500": &a3
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
        - Persons
      operationId: listPersons
      summary: List persons, one page at a time
      description: |
        Returns persons in no particular order. To read everything, pass `nextCursor` back
        as `cursor` until a response has no `nextCursor`. A page can be empty while
        `nextCursor` is still present. Reads are eventually consistent: a person created a
        moment ago may not be listed yet.
      parameters:
        - name: limit
          in: query
          description: Maximum number of persons on the page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          description: The `nextCursor` of the previous page. Opaque; don't build it yourself.
          schema:
            type: string
      responses:
        "200":
          description: One page of persons
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonPage"
        "400":
          description: "`limit` or `cursor` is invalid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                limit:
                  value:
                    message: limit must be an integer from 1 to 100
                cursor:
                  value:
                    message: cursor is invalid
        "403": *a1
        "429": *a2
        "500": *a3
  /person/{id}:
    get:
      tags:
        - Persons
      operationId: getPerson
      summary: Get a person by id
      description: |
        Strongly consistent, so following the `Location` header of a `201` always finds
        the person. The id is matched case-insensitively.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PersonId"
      responses:
        "200":
          description: The person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: The id is not a UUID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  value:
                    message: Person id must be a UUID
        "403": *a1
        "404":
          description: No person with this id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                notFound:
                  value:
                    message: Person not found
        "429": *a2
        "500": *a3
components:
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4, signed for service `execute-api` in `eu-west-1`.
      x-amazon-apigateway-authtype: awsSigv4
  schemas:
    PersonId:
      type: string
      format: uuid
      description: A version 4 UUID, created by the service
      example: 1249302d-9c20-4a1f-8cf5-afdd0173f2a9
    PersonInput:
      type: object
      description: All fields are required, must contain a non-space character and may be at most 200 characters. Values are trimmed. Other fields are rejected.
      required:
        - firstName
        - lastName
        - phoneNumber
        - address
      additionalProperties: false
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        lastName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        phoneNumber:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Any common format. Numbers without a country code are read as Dutch, so `06 12345678` becomes `+31612345678`. Invalid numbers are rejected.
        address:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
          description: Free text
    Person:
      type: object
      required:
        - id
        - firstName
        - lastName
        - phoneNumber
        - address
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/PersonId"
        firstName:
          type: string
          maxLength: 200
          example: Ada
        lastName:
          type: string
          maxLength: 200
          example: Lovelace
        phoneNumber:
          type: string
          description: E.164 format
          pattern: ^\+[1-9]\d{1,14}$
          example: "+31612345678"
        address:
          type: string
          maxLength: 200
          example: Dam 1, 1012 JS Amsterdam
        createdAt:
          type: string
          format: date-time
          example: 2026-11-04T14:12:09.077Z
    PersonPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        nextCursor:
          type: string
          description: Pass as `cursor` to get the next page. Absent on the last page.
          example: eyJpZCI6IjEyNDkzMDJkLTljMjAtNGExZi04Y2Y1LWFmZGQwMTczZjJhOSJ9
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    ValidationError:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        errors:
          type: array
          description: One entry per problem. Present when validation failed.
          items:
            type: string
  responses:
    Forbidden:
      description: Missing or invalid AWS signature, or the caller may not invoke the API
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingSignature:
              value:
                message: Missing Authentication Token
    TooManyRequests:
      description: Throttled by API Gateway (10 requests per second per stage, bursts up to 20)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            throttled:
              value:
                message: Too Many Requests
    InternalServerError:
      description: Unexpected error. It is logged without personal data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            internal:
              value:
                message: Internal server error
